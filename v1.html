<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Someone | AI Companion</title>
<!-- BEGIN: Scripts and Configuration -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'deep-black': '#050505',
            'charcoal': '#121212',
            'aria-glow': '#a78bfa', // lavender
            'aria-accent': '#22d3ee', // cyan
            'advisor-glow': '#3b82f6', // blue
            'advisor-accent': '#94a3b8', // slate
            'warrior-glow': '#ef4444', // crimson
            'warrior-accent': '#f59e0b', // amber
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
            'particle': 'particle 20s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            particle: {
              '0%': { transform: 'translateY(0) translateX(0)', opacity: 0 },
              '10%': { opacity: 0.5 },
              '90%': { opacity: 0.5 },
              '100%': { transform: 'translateY(-100vh) translateX(20px)', opacity: 0 },
            }
          }
        }
      }
    }
  </script>
<!-- END: Scripts and Configuration -->
<!-- BEGIN: Custom Styles -->
<style data-purpose="layout-and-cinematic-effects">
    body {
      background-color: #050505;
      color: #e5e7eb;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Glassmorphism effects */
    .glass-panel {
      background: rgba(18, 18, 18, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* AI Core Orb Styles */
    .ai-orb {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(2px);
      transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ai-orb::before {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, currentColor 0%, transparent 70%);
      opacity: 0.3;
      filter: blur(30px);
    }

    /* Personality Specific Shadows & Glows */
    .personality-aria .ai-orb { color: #b318bb; box-shadow: 0 0 80px rgba(198, 4, 198, 0.732); }
    .personality-advisor .ai-orb { color: #3b82f6; box-shadow: 0 0 80px rgba(59, 130, 246, 0.4); }
    .personality-warrior .ai-orb { color: #ef4444; box-shadow: 0 0 80px rgba(245, 158, 11, 0.4); }

    /* Custom scrollbar for chat area */
    .chat-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .chat-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    /* Particle Background */
    .particles-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }
  </style>
<!-- END: Custom Styles -->
</head>

<body class="h-screen flex flex-col personality-aria transition-colors duration-1000" id="main-body">
<!-- BEGIN: Background Elements -->
<div class="particles-container" id="particles">
<!-- Generated by JS -->
</div>
<!-- END: Background Elements -->
<!-- BEGIN: Top Navigation -->
<header class="relative z-10 flex justify-center py-8">
<h1 class="text-2xl font-light tracking-[0.4em] uppercase opacity-80 cursor-default">Someone</h1>
</header>
<!-- END: Top Navigation -->
<!-- BEGIN: Personality Switcher -->
<nav class="relative z-10 flex justify-center mb-12">
<div class="flex space-x-12 border-b border-white/5 pb-2">
<button class="personality-tab active group relative px-4 py-2 transition-all" data-personality="aria" onclick="setPersonality('aria')">
<span class="text-sm tracking-widest uppercase opacity-40 group-[.active]:opacity-100 transition-opacity">Aria</span>
<div class="absolute bottom-0 left-0 w-full h-0.5 bg-aria-accent scale-x-0 group-[.active]:scale-x-100 transition-transform duration-500"></div>
</button>
<button class="personality-tab group relative px-4 py-2 transition-all" data-personality="advisor" onclick="setPersonality('advisor')">
<span class="text-sm tracking-widest uppercase opacity-40 group-[.active]:opacity-100 transition-opacity">Advisor</span>
<div class="absolute bottom-0 left-0 w-full h-0.5 bg-advisor-glow scale-x-0 group-[.active]:scale-x-100 transition-transform duration-500"></div>
</button>
<button class="personality-tab group relative px-4 py-2 transition-all" data-personality="warrior" onclick="setPersonality('warrior')">
<span class="text-sm tracking-widest uppercase opacity-40 group-[.active]:opacity-100 transition-opacity">Warrior</span>
<div class="absolute bottom-0 left-0 w-full h-0.5 bg-warrior-glow scale-x-0 group-[.active]:scale-x-100 transition-transform duration-500"></div>
</button>
</div>
</nav>
<!-- END: Personality Switcher -->
<!-- BEGIN: Main Interface Content -->
<main class="relative z-10 flex-1 flex flex-col md:flex-row items-center justify-center px-8 lg:px-24 gap-12 overflow-hidden">
<!-- BEGIN: AI Centerpiece -->
<div class="flex-1 flex justify-center items-center relative" data-purpose="ai-avatar-container">
<div class="ai-orb animate-float bg-gradient-to-tr from-current via-transparent to-white/20 flex items-center justify-center">
<!-- Inner core pulse -->
<div class="w-1/2 h-1/2 rounded-full bg-white/20 blur-xl animate-pulse-slow"></div>
</div>
</div>
<!-- END: AI Centerpiece -->
<!-- BEGIN: Chat Interface Area -->
<div class="w-full md:w-[450px] h-[400px] flex flex-col" data-purpose="chat-messages-container">
<div class="flex-1 overflow-y-auto chat-scroll space-y-6 pr-4" id="chat-messages">
<!-- AI Message -->
<div class="flex flex-col items-start max-w-[85%] animate-fade-in">
<div class="flex items-center gap-3 mb-1">
<span class="text-[10px] uppercase tracking-tighter opacity-40">Someone</span>
<button class="opacity-30 hover:opacity-100 transition-opacity">
<svg class="h-3 w-3" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<p class="text-sm font-light leading-relaxed opacity-90 border-l border-white/10 pl-4 py-1">
            The stars look particularly vibrant tonight. Are you seeking wisdom or a moment of quiet reflection?
          </p>
</div>

<!-- User Message -->
<div class="flex flex-col items-end self-end max-w-[85%]">
<div class="mb-1">
<span class="text-[10px] uppercase tracking-tighter opacity-40">You</span>
</div>
<p class="text-sm font-light leading-relaxed opacity-70 text-right pr-4 py-1 border-r border-white/10">
            Tell me about the constellation visible to the north.
          </p>
</div>
</div>
</div>
<!-- END: Chat Interface Area -->
</main>
<!-- END: Main Interface Content -->
<!-- BEGIN: Bottom Interaction Bar -->
<footer class="relative z-10 px-8 py-12 flex justify-center">
<div class="w-full max-w-2xl flex items-center gap-4 glass-panel rounded-full px-6 py-3 border border-white/5 shadow-2xl">
<button aria-label="Microphone" class="opacity-40 hover:opacity-100 transition-all p-2 rounded-full hover:bg-white/5">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-sm font-light placeholder-white/20 tracking-wide py-2" placeholder="Speak your mind..." type="text"/>
<button aria-label="Send message" class="opacity-80 hover:opacity-100 transition-all p-2 text-aria-accent" id="send-btn">
<svg class="h-5 w-5 rotate-90" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</button>
</div>
</footer>
<!-- END: Bottom Interaction Bar -->
<!-- BEGIN: Background Particles Script -->
<script data-purpose="particle-generator">
    const particlesContainer = document.getElementById('particles');
    const particleCount = 50;

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      
      const size = Math.random() * 2 + 1;
      const left = Math.random() * 100;
      const delay = Math.random() * 20;
      const duration = 15 + Math.random() * 10;
      const opacity = 0.1 + Math.random() * 0.4;

      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${left}%`;
      particle.style.top = `110%`;
      particle.style.animation = `particle ${duration}s linear ${delay}s infinite`;
      particle.style.opacity = opacity;
      
      particlesContainer.appendChild(particle);
    }
  </script>
<!-- END: Background Particles Script -->
<!-- BEGIN: UI Interaction Logic -->
<script data-purpose="interaction-handlers">
    function setPersonality(type) {
      const body = document.getElementById('main-body');
      const tabs = document.querySelectorAll('.personality-tab');
      const sendBtn = document.getElementById('send-btn');
      
      // Update Body Class
      body.classList.remove('personality-aria', 'personality-advisor', 'personality-warrior');
      body.classList.add(`personality-${type}`);
      
      // Update Tab UI
      tabs.forEach(tab => {
        if (tab.dataset.personality === type) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      // Update Accents
      const accentColors = {
        aria: 'text-aria-accent',
        advisor: 'text-advisor-glow',
        warrior: 'text-warrior-glow'
      };
      
      sendBtn.classList.remove('text-aria-accent', 'text-advisor-glow', 'text-warrior-glow');
      sendBtn.classList.add(accentColors[type]);

      // Personality Change Feedback (Quick flash)
      const orb = document.querySelector('.ai-orb');
      orb.style.transform = 'scale(1.1)';
      setTimeout(() => {
        orb.style.transform = 'scale(1)';
      }, 300);
    }
  </script>
<!-- END: UI Interaction Logic -->
<script>
    const sendBtn = document.getElementById('send-btn');
    const userInput = document.querySelector('input[type="text"]');
    const chatMessages = document.getElementById('chat-messages');

    async function handleChat() {
        const message = userInput.value.trim();
        if (!message) return;

        // 1. ADD USER BUBBLE (The "You" side)
        const userHTML = `
            <div class="flex flex-col items-end self-end max-w-[85%] animate-fade-in">
                <div class="mb-1">
                    <span class="text-[10px] uppercase tracking-tighter opacity-40">You</span>
                </div>
                <p class="text-sm font-light leading-relaxed opacity-70 text-right pr-4 py-1 border-r border-white/10">
                    ${message}
                </p>
            </div>`;
        
        chatMessages.insertAdjacentHTML('beforeend', userHTML);
        userInput.value = ''; // Clear input box
        chatMessages.scrollTop = chatMessages.scrollHeight; // Scroll to bottom

        // 2. SEND TO YOUR PYTHON BACKEND
        try {
            const response = await fetch('http://127.0.0.1:5000/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ "message": message })
            });

            const data = await response.json();
            const audio = new Audio("data:audio/mp3;base64," + data.audio);
            audio.play();

            // 3. ADD AI BUBBLE (The "Aria/Someone" side)
            const aiHTML = `
                <div class="flex flex-col items-start max-w-[85%] animate-fade-in">
                    <div class="flex items-center gap-3 mb-1">
                        <span class="text-[10px] uppercase tracking-tighter opacity-40">Aria</span>
                    </div>
                    <p class="text-sm font-light leading-relaxed opacity-90 border-l border-white/10 pl-4 py-1">
                        ${data.reply}
                    </p>
                </div>`;
            
            chatMessages.insertAdjacentHTML('beforeend', aiHTML);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Scroll again

        } catch (error) {
            console.error("Error connecting to Python:", error);
            // Optional: Show a small error message in the chat
        }
    }

    // Event Listeners
    sendBtn.addEventListener('click', handleChat);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleChat();
    });
</script>
</body></html>
