<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'deep-black': '#050505',
            'charcoal': '#121212',
            'aria-glow': '#a78bfa', // lavender
            'aria-accent': '#22d3ee', // cyan
            'advisor-glow': '#3b82f6', // blue
            'advisor-accent': '#94a3b8', // slate
            'oracle-glow': '#1e40af', // deep cold blue
            'oracle-accent': '#93c5fd', // light blue
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
            'particle': 'particle 20s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            particle: {
              '0%': { transform: 'translateY(0) translateX(0)', opacity: 0 },
              '10%': { opacity: 0.5 },
              '90%': { opacity: 0.5 },
              '100%': { transform: 'translateY(-100vh) translateX(20px)', opacity: 0 },
            }
          }
        }
      }
    }
  </script>

<!-- BEGIN: Custom Styles -->
<style data-purpose="layout-and-cinematic-effects">
    body {
      background-color: #050505;
      color: #e5e7eb;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Glassmorphism effects */
    .glass-panel {
      background: rgba(18, 18, 18, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* AI Core Orb Styles */
    .ai-orb {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(2px);
      transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ai-orb::before {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, currentColor 0%, transparent 70%);
      opacity: 0.3;
      filter: blur(30px);
    }

    /* Personality Specific Shadows & Glows */
    .personality-aria .ai-orb { color: #b318bb; box-shadow: 0 0 80px rgba(198, 4, 198, 0.732); }
    .personality-advisor .ai-orb { color: #3b82f6; box-shadow: 0 0 80px rgba(59, 130, 246, 0.4); }
    .personality-oracle .ai-orb { color: #1e40af; box-shadow: 0 0 80px rgba(30, 64, 175, 0.5); }

    /* Custom scrollbar for chat area */
    .chat-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .chat-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    /* Particle Background */
    .particles-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Intro Block ────────────────────────────────────────────────── */
    .intro-block {
      padding: 2rem 0.5rem 1.5rem 0;
      position: relative;
    }
    .intro-persona-label {
      display: block;
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.22;
      margin-bottom: 0.7rem;
      font-weight: 400;
    }
    .intro-accent-line {
      border-left: 1px solid var(--accent, rgba(160,80,255,0.4));
      padding-left: 1.25rem;
    }
    .intro-text {
      font-style: italic;
      font-size: 0.875rem;
      font-weight: 300;
      line-height: 1.8;
      opacity: 0.68;
      letter-spacing: 0.01em;
    }
    .intro-divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 1.1rem auto 0;
      opacity: 0;
      transition: opacity 0.7s ease 0.3s;
    }
    .intro-divider.visible { opacity: 1; }

    /* Breathing dots */
    .intro-dots-container {
      display: flex;
      gap: 7px;
      align-items: center;
      padding: 1.6rem 0.25rem;
    }
    .breath-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      animation: breathe 1.9s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.15; }
      50%       { opacity: 0.75; }
    }

    /* Intro slide-up entrance */
    .intro-animate-in {
      animation: introSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes introSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ── Voice Overlay (Push-to-Talk) ───────────────────────────────── */
    .voice-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5,5,5,0.9);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }
    .voice-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .voice-hint {
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      opacity: 0.28;
    }
    #voice-transcript {
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      opacity: 0.72;
      max-width: 340px;
      text-align: center;
      min-height: 1.8em;
      font-style: italic;
    }
    #voice-overlay-close {
      position: absolute;
      top: 1.75rem;
      right: 2rem;
      opacity: 0.28;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      background: none;
      border: none;
      color: white;
      transition: opacity 0.2s;
    }
    #voice-overlay-close:hover { opacity: 0.7; }

    #voice-canvas {
      pointer-events: none;
    }

    /* ── Mic states ─────────────────────────────────────────────────── */
    .mic-lockout {
      opacity: 0.12 !important;
      pointer-events: none !important;
      transition: opacity 0.4s;
    }
    .mic-dict-active {
      color: #a78bfa;
      opacity: 0.95 !important;

      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;

    /* ── Auth Modal ─────────────────────────────────────────────── */

    .auth-input {

    .auth-btn {

    .auth-toggle {

<script data-purpose="particle-generator">
    const particlesContainer = document.getElementById('particles');
    const particleCount = 50;

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      
      const size = Math.random() * 2 + 1;
      const left = Math.random() * 100;
      const delay = Math.random() * 20;
      const duration = 15 + Math.random() * 10;
      const opacity = 0.1 + Math.random() * 0.4;

      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${left}%`;
      particle.style.top = `110%`;
      particle.style.animation = `particle ${duration}s linear ${delay}s infinite`;
      particle.style.opacity = opacity;
      
      particlesContainer.appendChild(particle);
    }
  </script>
<!-- END: Background Particles Script -->

<script data-purpose="interaction-handlers">
    function setPersonality(type) {
      const body = document.getElementById('main-body');
      const tabs = document.querySelectorAll('.personality-tab');
      const sendBtn = document.getElementById('send-btn');
      
      // Update Body Class
      body.classList.remove('personality-aria', 'personality-advisor', 'personality-oracle');
      body.classList.add(`personality-${type}`);
      
      // Update Tab UI
      tabs.forEach(tab => {
        if (tab.dataset.personality === type) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      // Update Accents
      const accentColors = {
        aria: 'text-aria-accent',
        advisor: 'text-advisor-glow',
        oracle: 'text-oracle-glow'
      };
      
      sendBtn.classList.remove('text-aria-accent', 'text-advisor-glow', 'text-oracle-glow');
      sendBtn.classList.add(accentColors[type]);

      // Personality Change Feedback (Quick flash)
      const orb = document.querySelector('.ai-orb');
      orb.style.transform = 'scale(1.1)';
      setTimeout(() => {
        orb.style.transform = 'scale(1)';
      }, 300);

      // Fetch intro for this persona on first visit (aria/oracle only)
      if (type === 'aria' || type === 'oracle') {
        if (typeof fetchIntro === 'function') fetchIntro(type);
      }
    }
  </script>
<!-- END: UI Interaction Logic -->
<script>
// ── Auth State ──────────────────────────────────────────────────────────────
const API = 'https://someone-rh2d.onrender.com';

function _getToken()     { return localStorage.getItem('sv1_token') || ''; }
function _getSessionId() { return localStorage.getItem('sv1_session_id') || ''; }

function _authHeaders(extra = {}) {
    return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + _getToken(),
        'X-Session-ID': _getSessionId(),
        ...extra,
    };
}

function _authHeadersNoJson() {
    // For FormData (file upload) — no Content-Type override
    return {
        'Authorization': 'Bearer ' + _getToken(),
        'X-Session-ID': _getSessionId(),
    };
}

// ── Auth Modal Logic ────────────────────────────────────────────────────────
(function initAuth() {
    // Intercept Google OAuth Redirect
    if (window.location.hash.includes('access_token=')) {
        const params = new URLSearchParams(window.location.hash.substring(1));
        const token = params.get('access_token');
        if (token) {
            localStorage.setItem('sv1_token', token);
            if (!localStorage.getItem('sv1_session_id')) {
                localStorage.setItem('sv1_session_id', 'sess_' + Math.random().toString(36).substr(2, 9));
            }
            window.history.replaceState(null, '', window.location.pathname);
        }
    }

    const modal       = document.getElementById('auth-modal');
    const emailEl     = document.getElementById('auth-email');
    const passEl      = document.getElementById('auth-password');
    const submitBtn   = document.getElementById('auth-submit-btn');
    const toggleBtn   = document.getElementById('auth-mode-toggle');
    const modeLabel   = document.getElementById('auth-mode-label');

    function renderMinimalGraph(data) {
        const svg = document.getElementById('health-svg');
        const w = 220; const h = 120;
        const paddingLeft = 20;
        const paddingTop = 15;
        const plotW = w - paddingLeft;
        const plotH = h - paddingTop - 15;
        const points = data.sleep.length;
        const dx = points > 1 ? plotW / (points - 1) : 0;
        
        const scaleY = (val, max) => paddingTop + plotH - ((val / max) * plotH);
        const days = Array.from({length: points}, (_, i) => `Day ${i+1}`);
        
        let pathSleep = '', pathStress = '', pathEnergy = '';
        
        for (let i = 0; i < points; i++) {
            const x = paddingLeft + i * dx;
            const prefix = (i === 0) ? 'M' : 'L';
            pathSleep += `${prefix} ${x},${scaleY(data.sleep[i], 12)} `;   
            pathStress += `${prefix} ${x},${scaleY(data.stress[i], 10)} `; 
            pathEnergy += `${prefix} ${x},${scaleY(data.energy[i], 10)} `; 
        }

        let markup = `
            <!-- Legend -->
            <g font-size="8" font-family="Inter, sans-serif" fill="white" opacity="0.6" letter-spacing="0.1em">
                <circle cx="${paddingLeft}" cy="6" r="2.5" fill="#a78bfa" />
                <text x="${paddingLeft + 5}" y="9">SLEEP</text>
                <circle cx="${paddingLeft + 45}" cy="6" r="2.5" fill="#ef4444" />
                <text x="${paddingLeft + 50}" y="9">STRESS</text>
                <circle cx="${paddingLeft + 95}" cy="6" r="2.5" fill="#22d3ee" />
                <text x="${paddingLeft + 100}" y="9">ENERGY</text>
            </g>

            <!-- Y Axis Markers -->
            <g font-size="7" font-family="Inter, sans-serif" fill="white" opacity="0.4" text-anchor="end">
                <text x="${paddingLeft - 4}" y="${paddingTop + 6}">MAX</text>
                <text x="${paddingLeft - 4}" y="${paddingTop + plotH}">0</text>
            </g>

            <!-- Data Paths -->
            <path d="${pathStress}" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
            <path d="${pathEnergy}" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
            <path d="${pathSleep}" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
        `;
        
        // X-axis Days
        for (let i = 0; i < points; i++) {
            markup += `<text x="${paddingLeft + i * dx}" y="${paddingTop + plotH + 12}" font-size="7" font-family="Inter, sans-serif" fill="white" opacity="0.4" text-anchor="middle" letter-spacing="0.05em">${days[i]}</text>`;
        }
        
        if (data.anomaly_indices) {
            data.anomaly_indices.forEach(idx => {
                const px = paddingLeft + idx * dx;
                markup += `
                    <line x1="${px}" y1="${paddingTop}" x2="${px}" y2="${paddingTop + plotH}" stroke="white" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />
                    <circle cx="${px}" cy="${scaleY(data.stress[idx], 10)}" r="2.5" fill="#ef4444" />
                    <circle cx="${px}" cy="${scaleY(data.sleep[idx], 12)}" r="2.5" fill="#a78bfa" />
                `;
            });
        }
        
        svg.innerHTML = markup;
    }
</script>

<script>
// ── Intro System ──────────────────────────────────────────────────────────────
const introFetched = { aria: false, oracle: false, advisor: false };

async function fetchIntro(persona) {
    if (introFetched[persona]) return;
    introFetched[persona] = true;

    const msgs = document.getElementById('chat-messages');
    const accentColor = persona === 'oracle'

        if (dotsEl) { dotsEl.style.opacity = '0'; setTimeout(() => dotsEl.remove(), 420); }

        await new Promise(r => setTimeout(r, 460));

        // Insert styled intro block
        const introId = `intro-block-${persona}`;
        msgs.insertAdjacentHTML('beforeend', `
            <div id="${introId}" class="intro-block intro-animate-in" style="--accent:${accentColor}">
                <span class="intro-persona-label">${labelText}</span>
                <div class="intro-accent-line">
                    <p class="intro-text">${data.reply}</p>
                </div>
                <div class="intro-divider" id="intro-div-${persona}"></div>
            </div>`);
        msgs.scrollTop = msgs.scrollHeight;

        // Fade in divider after short beat
        setTimeout(() => {
            const d = document.getElementById(`intro-div-${persona}`);
            if (d) d.classList.add('visible');
        }, 350);

        // TTS + orb pulse
        if (data.audio) {
            orbPulse(true);
            const aud = new Audio('data:audio/mp3;base64,' + data.audio);
            aud.addEventListener('ended', () => orbPulse(false));
            aud.play().catch(() => {});
        } else if (persona === 'oracle' && data.reply) {
            // Oracle uses browser speech
            const utt = new SpeechSynthesisUtterance(data.reply);
            const vs  = window.speechSynthesis.getVoices();
            const v   = vs.find(v => v.name.includes('David') || v.name.includes('Mark'))
                     || vs.find(v => v.name.toLowerCase().includes('male'))
                     || vs[0];
            if (v) utt.voice = v;
            utt.pitch = 0.75; utt.rate = 0.9;
            utt.onstart = () => orbPulse(true);

// ── Orb Pulse ─────────────────────────────────────────────────────────────────
function orbPulse(on) {
    const orb = document.querySelector('.ai-orb');
    if (!orb) return;
    if (on) orb.classList.add('orb-speaking');
    else orb.classList.remove('orb-speaking');
}

// ── Mic Lockout ───────────────────────────────────────────────────────────────
let _micLockTimer = null;
function lockMics(ms) {
    const btns = [document.getElementById('mic-dictation'), document.getElementById('orb-ptt-trigger')];
    btns.forEach(b => { if (b) b.classList.add('mic-lockout'); });
    clearTimeout(_micLockTimer);
    _micLockTimer = setTimeout(() => {
        btns.forEach(b => { if (b) b.classList.remove('mic-lockout'); });
    }, ms);
}

// ── Push-to-Talk ──────────────────────────────────────────────────────────────
let _pttActive = false, _pttRecog = null, _pttTranscript = '';
let _pttAnimFrame = null, _pttAudioCtx = null, _pttStream = null;

const _orbPTT       = document.getElementById('orb-ptt-trigger');
const _voiceOverlay = document.getElementById('voice-overlay');
const _voiceCanvas  = document.getElementById('voice-canvas');
const _voiceTxt     = document.getElementById('voice-transcript');
const _voiceClose   = document.getElementById('voice-overlay-close');

function _drawRing(canvas, analyser) {
    const ctx2 = canvas.getContext('2d');
    const W = 320, H = 320, cx = W/2, cy = H/2;
    const bufLen = analyser.frequencyBinCount;
    const data   = new Uint8Array(bufLen);
    const BARS   = 64, R = 110, BARMAX = 55;

    function draw() {
        _pttAnimFrame = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(data);
        ctx2.clearRect(0, 0, W, H);

        // Central glow
        const avg  = data.slice(0, 64).reduce((a, b) => a + b, 0) / 64;
        const gr   = R * 0.38 + (avg / 255) * R * 0.16;
        const grad = ctx2.createRadialGradient(cx, cy, 0, cx, cy, gr);
        grad.addColorStop(0,   'rgba(160,80,255,0.9)');
        grad.addColorStop(0.6, 'rgba(120,30,210,0.38)');
        grad.addColorStop(1,   'rgba(70,0,140,0)');
        ctx2.beginPath(); ctx2.arc(cx, cy, gr, 0, Math.PI*2);
        ctx2.fillStyle = grad; ctx2.fill();

        // Frequency ring
        for (let i = 0; i < BARS; i++) {
            const angle = (i / BARS) * Math.PI * 2 - Math.PI / 2;
            const val   = data[Math.floor((i / BARS) * bufLen)] / 255;
            const bh    = val * BARMAX + 5;
            const x1 = cx + Math.cos(angle) * R;
            const y1 = cy + Math.sin(angle) * R;
            const x2 = cx + Math.cos(angle) * (R + bh);
            const y2 = cy + Math.sin(angle) * (R + bh);
            ctx2.beginPath(); ctx2.moveTo(x1, y1); ctx2.lineTo(x2, y2);
            ctx2.strokeStyle = `rgba(160,80,255,${0.35 + val * 0.65})`;
            ctx2.lineWidth = 2.5; ctx2.lineCap = 'round'; ctx2.stroke();
        }
    }
    draw();
}

async function _startPTT() {
    try {
        _pttStream   = await navigator.mediaDevices.getUserMedia({ audio: true });
        _pttAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = _pttAudioCtx.createAnalyser();
        analyser.fftSize = 256;
        _pttAudioCtx.createMediaStreamSource(_pttStream).connect(analyser);

        const dpr = window.devicePixelRatio || 1;
        _voiceCanvas.width  = 320 * dpr; _voiceCanvas.height = 320 * dpr;
        _voiceCanvas.style.cssText = 'width:320px;height:320px';
        _voiceCanvas.getContext('2d').scale(dpr, dpr);
        _drawRing(_voiceCanvas, analyser);

        _voiceOverlay.classList.add('active');
        if(_orbPTT) {
           _orbPTT.classList.add('mic-ptt-active');
           _orbPTT.classList.add('used'); // hide hint label
        }

        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SR) {
            _pttRecog = new SR();
            _pttRecog.continuous = true; _pttRecog.interimResults = true;
            _pttRecog.onresult = e => {
                let final = '', interim = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    (e.results[i].isFinal ? (final += e.results[i][0].transcript)
                                          : (interim += e.results[i][0].transcript));
                }
                _pttTranscript = final || interim;
                _voiceTxt.textContent = _pttTranscript;
            };
            _pttRecog.start();
        }
        _pttActive = true;

    } catch (err) {
        console.error('[PTT start]', err);
        _stopPTT(false);
    }
}

function _stopPTT(send = true) {
    if (_pttAnimFrame) cancelAnimationFrame(_pttAnimFrame);
    if (_pttAudioCtx) _pttAudioCtx.close().catch(() => {});
    if (_pttStream)   _pttStream.getTracks().forEach(t => t.stop());
    if (_pttRecog)    _pttRecog.stop();
    _pttActive = false; _pttAudioCtx = null; _pttStream = null; _pttRecog = null;
    _voiceOverlay.classList.remove('active');
    if(_orbPTT) _orbPTT.classList.remove('mic-ptt-active');

    if (send && _pttTranscript.trim()) {
        document.getElementById('user-input').value = _pttTranscript.trim();
        _pttTranscript = ''; _voiceTxt.textContent = '';
        handleChat();
    } else {
        _pttTranscript = ''; _voiceTxt.textContent = '';
    }
}

if (_orbPTT) _orbPTT.addEventListener('click', () => {
    if (_orbPTT.classList.contains('mic-lockout')) return;
    _pttActive ? _stopPTT(true) : _startPTT();
});

// Tap overlay background to send, close button to cancel
if (_voiceOverlay) _voiceOverlay.addEventListener('click', e => {
    if (e.target === _voiceOverlay || e.target.closest('#voice-transcript') || e.target.classList.contains('voice-hint')) {
        if (_pttActive) _stopPTT(true);
    }
});
if (_voiceClose) _voiceClose.addEventListener('click', e => { e.stopPropagation(); _stopPTT(false); });

// ── Dictation Mic ─────────────────────────────────────────────────────────────
let _dictActive = false, _dictRecog = null;
const _micDict   = document.getElementById('mic-dictation');
const _userInput = document.getElementById('user-input');

if (_micDict) _micDict.addEventListener('click', () => {
    if (_micDict.classList.contains('mic-lockout')) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { console.warn('SpeechRecognition not supported in this browser'); return; }

    if (!_dictActive) {
        _dictActive = true;
        _micDict.classList.add('mic-dict-active');
        _dictRecog = new SR();
        _dictRecog.continuous = true; _dictRecog.interimResults = true;
        _dictRecog.onresult = e => {
            let t = '';
            for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
            _userInput.value = t;
            _userInput.style.height = 'auto';
            _userInput.style.height = _userInput.scrollHeight + 'px';
            _userInput.scrollTop = _userInput.scrollHeight;
        };
        _dictRecog.onend = () => {
            _dictActive = false;
            _micDict.classList.remove('mic-dict-active');
            _dictRecog = null;
        };
        _dictRecog.start();
    } else {
        _dictActive = false;
        if (_dictRecog) { _dictRecog.stop(); _dictRecog = null; }
        _micDict.classList.remove('mic-dict-active');
    }
});
